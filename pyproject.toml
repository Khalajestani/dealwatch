[project]
name = "dealwatch"
version = "1.0.0"
description = "Personal deal watcher: keeps a shopping and wish list and has Claude, on the owner's Claude plan, find real deals at the shops you allow."
authors = [{ name = "Amir", email = "khalajestani@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "claude-agent-sdk>=0.2.165",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "markdown>=3.6",
    "pillow>=10",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
dealwatch-backup = "dealwatch.backup:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter wraps code; prompts and help texts stay one string per line
