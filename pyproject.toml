[project]
name = "dealwatch"
version = "0.1.0"
description = "Personal deal watcher: keeps a shopping/wish list and uses Claude web search to find real deals at the retailers you allow."
authors = [{ name = "Amir", email = "khalajestani@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "markdown>=3.6",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
dealwatch = "dealwatch.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
